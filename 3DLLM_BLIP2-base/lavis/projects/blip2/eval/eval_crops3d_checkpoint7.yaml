

model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  mask_embedding: False

datasets:
  3d_vqa: # name of the dataset builder
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 364
        eval:
          name: "blip_image_eval"
          image_size: 364
    text_processor:
        train:
          name: "blip_question"
          prompt: ""
        eval:
          name: "blip_question"
    build_info:
        annotations:
          train:
            storage: /project/3dllms/melgin/3D-LLM_for_UPD-3D/data/questions/Crops3D/Crops3D_train.json
          test:
            storage: /project/3dllms/melgin/3D-LLM_for_UPD-3D/data/questions/Crops3D/Crops3D_val.json
          val:
            storage: /project/3dllms/melgin/3D-LLM_for_UPD-3D/data/questions/Crops3D/Crops3D_val.json

run:
  task: 3d_vqa
  
  # Evaluation settings
  batch_size_train: 2
  batch_size_eval: 4
  num_workers: 4

  max_len: 40
  min_len: 1
  num_beams: 5
 
  inference_method: "generate"

  seed: 42
  output_dir: "output/BLIP2/3DQA_Crops3D_eval"

  amp: True
  resume_ckpt_path: /project/3dllms/melgin/3D-LLM_for_UPD-3D/3DLLM_BLIP2-base/lavis/output/BLIP2/3DQA_Crops3D/20251016101/checkpoint_7.pth
  evaluate: True
  verbose: True
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "tcp://127.0.0.1:29500"
  distributed: False

